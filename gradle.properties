# Project-wide Gradle settings
# Memory configuration: dynamic allocation up to 12GB for D8/R8
# -Xms4g: initial heap size 4GB
# -Xmx12g: maximum heap size 12GB (dynamic growth up to this limit)
# -XX:MaxMetaspaceSize=2g: metaspace limit
org.gradle.jvmargs=-Xms4g -Xmx12g -XX:MaxMetaspaceSize=2g -XX:+UseG1GC -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:MaxGCPauseMillis=200 -XX:G1HeapRegionSize=16m -XX:InitiatingHeapOccupancyPercent=35

# D8 process memory (AGP 8.0+)
# This is passed to the D8 compiler process via the DEX_OPTIONS
# Увеличено до 12G для KMP-проектов с большим количеством intermediate классов
android.d8.maxHeapSize=12g
# Включаем D8 daemon для повторного использования процесса (экономия памяти)
android.d8.disableDaemon=false
# Set D8 max workers to 1 to reduce memory pressure
android.d8.maxWorkers=1
# Disable multidex to reduce D8 memory usage
android.enableMultidex=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true
org.gradle.daemon.idleTimeout=3600000
org.gradle.priority=normal

# Build Cache Configuration
org.gradle.configuration-cache=false
org.gradle.configuration-cache-problems=warn

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.caching.enabled=true
kotlin.native.cacheKind=static
kotlin.native.ignoreDisabledTargets=true
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.applyDefaultHierarchyTemplate=false
# Enable expect/actual classes (Beta feature in Kotlin 2.0)
kotlin.experimental.expect-actual-classes=true
kotlin.daemon.jvmargs=-Xms2g -Xmx8g -XX:MaxMetaspaceSize=1g

# Android
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.overridePathCheck=true

# Compose (Kotlin 2.0+ — compiler встроен в плагин org.jetbrains.kotlin.plugin.compose)
# compose.kotlinCompilerExtensionVersion больше не требуется

# Version
version=0.5.1.1-beta
group=com.company.ipcamera

# =============================================================================
# Build Flags for Pipeline
# =============================================================================
ipcss.buildAndroidNative=false
ipcss.buildNative=false
ipcss.buildKotlin=true
ipcss.buildWeb=true
ipcss.buildDocker=false

# =============================================================================
# Test Optimization Flags
# =============================================================================
ipcss.skipNativeTargets=true
ipcss.disableNativeTargets=true
org.gradle.test.parallel=true
org.gradle.test.timeout=60