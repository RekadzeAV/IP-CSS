###############################################################################
# IP-CSS NGINX Load Balancer Configuration
# Дата: 17.07.2026
# Описание: Балансировка нагрузки между узлами IP-CSS + health checks
###############################################################################

upstream ipcss_backend {
    # ========== Session Affinity (sticky sessions) ==========
    # Включается через LB_SESSION_AFFINITY=true в ClusterConfig
    # Используем sticky cookie для привязки сессии к узлу
    sticky cookie srv_id expires=1h domain=.ipcss.local path=/;

    # ========== Backend Nodes ==========
    # Автоматически генерируется ClusterService/consul
    # Формат: server <host>:<port> weight=<n> max_fails=<n> fail_timeout=<n>s;
    server 192.168.1.10:8080 weight=5 max_fails=3 fail_timeout=30s;
    server 192.168.1.11:8080 weight=5 max_fails=3 fail_timeout=30s;
    server 192.168.1.12:8080 weight=3 max_fails=3 fail_timeout=30s;

    # ========== Health Checks (Active) ==========
    # NGINX Plus требует commercial subscription для active health checks
    # В open-source используем passive health checks (max_fails + fail_timeout)
    # Для NGINX Plus:
    # zone ipcss_backend 64k;
    # health_check interval=10s fails=3 passes=2 uri=/api/v1/health;
}

# ========== HTTP → HTTPS Redirect ==========
server {
    listen 80;
    server_name ipcss.local;
    return 301 https://$host$request_uri;
}

# ========== Main HTTPS Server ==========
server {
    listen 443 ssl http2;
    server_name ipcss.local;

    # ========== SSL Configuration ==========
    ssl_certificate /etc/nginx/ssl/ipcss.crt;
    ssl_certificate_key /etc/nginx/ssl/ipcss.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ========== Security Headers ==========
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ========== Buffer/Timeout Settings ==========
    client_body_buffer_size 10m;
    client_max_body_size 0;  # Unlimited for video uploads
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # ========== Gzip Compression ==========
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        image/svg+xml;

    # ========== HLS Streaming (no gzip) ==========
    location ~* \.(m3u8|ts)$ {
        gzip off;
        proxy_pass http://ipcss_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # HLS specific
        proxy_buffering off;
        proxy_cache off;
        sendfile on;
        tcp_nopush on;
    }

    # ========== WebSocket ==========
    location /api/v1/ws {
        proxy_pass http://ipcss_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ========== API ==========
    location /api/ {
        proxy_pass http://ipcss_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========== Health Check Endpoint (internal) ==========
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ========== Web Frontend ==========
    location / {
        proxy_pass http://ipcss_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ========== Access & Error Logs ==========
    access_log /var/log/nginx/ipcss-access.log main buffer=32k flush=5s;
    error_log /var/log/nginx/ipcss-error.log warn;
}

# ========== Log Format ==========
log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" "$http_x_forwarded_for" '
                'upstream=$upstream_addr request_time=$request_time';

# ========== Rate Limiting Zones ==========
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# ========== Limits ==========
limit_req zone=api_limit burst=50 nodelay;
