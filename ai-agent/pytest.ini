# pytest.ini
# Configuration for pytest

[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = src

# Test execution
asyncio_mode = auto
# e2e-тесты (реальный ChromaDB/LLM/сервер) исключаются из обычного прогона:
# запускаются явно `python -m pytest -m e2e` при наличии внешних сервисов (порт A).
addopts = -m "not e2e" -v --tb=short --cov=src --cov-report=html --cov-report=term-missing

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Slow tests
