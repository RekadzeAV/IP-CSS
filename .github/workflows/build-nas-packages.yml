name: Build NAS Packages

on:
  push:
    tags:
      - 'v*'
      - 'Alfa-*'
      - 'Beta-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., Alfa-0.0.1)'
        required: true
        default: 'Alfa-0.0.1'
      architectures:
        description: 'Architectures to build (comma-separated: x86_64,arm64)'
        required: true
        default: 'x86_64,arm64'
      packages:
        description: 'Package types to build (comma-separated: synology,qnap,asustor,truenas)'
        required: true
        default: 'synology,qnap,asustor,truenas'

jobs:
  build-nas-packages:
    name: Build NAS Packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ['x86_64', 'arm64']
        package: ['synology', 'qnap', 'asustor', 'truenas']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK and Gradle cache
        uses: ./.github/actions/setup-jdk-gradle
        with:
          gradle-cache-key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          gradle-restore-keys: ${{ runner.os }}-gradle-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/web/package-lock.json

      - name: Grant execute permission for scripts
        run: |
          chmod +x gradlew
          chmod +x scripts/*.sh
          find scripts -name "*.sh" -exec chmod +x {} \;

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" == "tag" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "version=Alfa-0.0.1" >> $GITHUB_OUTPUT
          fi

      - name: Validate NAS contracts and CI matrix inputs
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.packages || 'synology,qnap,asustor,truenas' }}
          ARCHITECTURES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.architectures || 'x86_64,arm64' }}
        run: |
          chmod +x scripts/ci/validate-nas-contracts.sh
          ./scripts/ci/validate-nas-contracts.sh

      - name: Build server API
        run: ./gradlew :server:api:build --no-daemon

      - name: Build web UI
        working-directory: server/web
        run: |
          npm ci
          npm run build

      - name: Build native libraries (if needed)
        run: |
          # Check if native libraries are needed
          if [ -d "native" ]; then
            echo "Native libraries directory found, building..."
            # Note: Native libraries build may require additional setup
            # This is a placeholder for future native library builds
          fi

      - name: Build NAS package
        run: |
          ./scripts/build-nas-package.sh ${{ matrix.package }} ${{ matrix.arch }} ${{ steps.version.outputs.version }}

      - name: NAS smoke checks
        if: matrix.package != 'truenas'
        run: |
          ./scripts/test-nas-build.sh ${{ matrix.package }} ${{ matrix.arch }}

      - name: Generate SHA256 checksums
        run: |
          mkdir -p build/checksums
          shopt -s nullglob
          for file in build/*.spk build/*.qpkg build/*.apk; do
            sha256sum "$file" > "build/checksums/$(basename "$file").sha256"
          done
          if compgen -G "build/truenas-*" > /dev/null; then
            tar -czf "build/truenas-${{ steps.version.outputs.version }}-${{ matrix.arch }}.tar.gz" build/truenas-*/
            sha256sum "build/truenas-${{ steps.version.outputs.version }}-${{ matrix.arch }}.tar.gz" > "build/checksums/truenas-${{ steps.version.outputs.version }}-${{ matrix.arch }}.tar.gz.sha256"
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nas-package-${{ matrix.package }}-${{ matrix.arch }}-${{ steps.version.outputs.version }}
          path: |
            build/*.${{ matrix.package == 'synology' && 'spk' || matrix.package == 'qnap' && 'qpkg' || matrix.package == 'asustor' && 'apk' || 'tar.gz' }}
            build/truenas-*/
            build/checksums/*.sha256
          retention-days: 30

  build-docker-images:
    name: Build Docker Images for TrueNAS
    runs-on: ubuntu-latest
    if: contains(github.event.inputs.packages, 'truenas') || github.event_name != 'workflow_dispatch'
    strategy:
      matrix:
        arch: ['linux/amd64', 'linux/arm64']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" == "tag" ]; then
            VERSION=${GITHUB_REF#refs/tags/}
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "version=Alfa-0.0.1" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: platforms/nas-x86_64/docker/Dockerfile
          platforms: ${{ matrix.arch }}
          push: false
          tags: |
            ip-css:${{ steps.version.outputs.version }}
            ip-css:${{ matrix.arch == 'linux/amd64' && 'latest-x86_64' || 'latest-arm64' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/ip-css-${{ matrix.arch }}.tar

      - name: Upload Docker image
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-${{ matrix.arch }}-${{ steps.version.outputs.version }}
          path: /tmp/ip-css-${{ matrix.arch }}.tar
          retention-days: 30

  create-release:
    name: Create NAS release
    runs-on: ubuntu-latest
    needs: [build-nas-packages, build-docker-images]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download NAS package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: nas-package-*
          merge-multiple: true

      - name: Download Docker image artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: docker-image-*
          merge-multiple: true

      - name: Create release (single publisher job)
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-artifacts/**/*.spk
            release-artifacts/**/*.qpkg
            release-artifacts/**/*.apk
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.sha256
            release-artifacts/**/*.tar
          draft: false
          prerelease: ${{ contains(github.ref, 'Alfa') || contains(github.ref, 'Beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
