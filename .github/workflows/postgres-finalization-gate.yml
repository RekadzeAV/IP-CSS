name: PostgreSQL Finalization Gate

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "server/api/**"
      - "shared/src/desktopMain/**"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/ci/check-postgres-finalization.sh"
      - ".github/workflows/postgres-finalization-gate.yml"
  workflow_dispatch:

jobs:
  postgres-finalization-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PostgreSQL finalization invariants
        run: bash ./scripts/ci/check-postgres-finalization.sh
