name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *'  # Every day at 02:00 UTC
  workflow_dispatch:

jobs:
  # ===========================================================================
  # Full test suite (long-running)
  # ===========================================================================
  full-test:
    name: Full Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ipcss_test
          POSTGRES_USER: ipcss
          POSTGRES_PASSWORD: ipcss_test
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Full test run
        run: |
          ./gradlew test integrationTest --no-daemon --parallel --continue
        env:
          API_GLOBAL_RATE_LIMIT_ENABLED: 'false'
        
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-test-report
          path: '**/build/reports/tests/'

  # ===========================================================================
  # Security scan
  # ===========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Dependency manifest check (см. ci.yml security-audit)
        run: python3 scripts/ci/export-dependency-manifest.py

  # ===========================================================================
  # Distribution smoke: installDist-артефакт собирается и launch-скрипты на месте.
  # Полноценный smoke-запуск сервера покрыт job'ом test (integrationTest).
  # ===========================================================================
  distribution-smoke:
    name: Distribution Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      - name: Build server
        run: ./gradlew :server:api:installDist --no-daemon -x test

      - name: Distribution smoke check
        run: |
          # Полный тест: сервер стартует только с настроенной PostgreSQL (fail-fast preflight).
          # Для smoke-проверки артефакта достаточно убедиться, что дистрибутив собран и
          # launch-скрипты на месте; полноценный запуск покрыт job'ом test (integrationTest).
          test -x server/api/build/install/api/bin/api
          test -f server/api/build/install/api/lib/*
          echo "Server distribution is buildable and launchable (installDist OK)."
      
      - name: Save benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: '**/build/reports/benchmarks/'

  # ===========================================================================
  # Daily summary
  # ===========================================================================
  summary:
    runs-on: ubuntu-latest
    needs: [full-test, security, distribution-smoke]
    if: always()
    steps:
      - name: Send nightly summary
        run: |
          echo "## Nightly Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Full Tests | ${{ needs.full-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Distribution Smoke | ${{ needs.distribution-smoke.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date -u)" >> $GITHUB_STEP_SUMMARY
