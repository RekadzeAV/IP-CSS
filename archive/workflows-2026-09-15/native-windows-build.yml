name: Native Windows Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'native/**'
      - 'core/network/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'native/**'
      - 'core/network/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-native:
    name: Build Native (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.2.1'

      - name: Setup MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          version: '12.2.0'

      - name: Build video-processing native library
        run: |
          .\scripts\build-video-processing-lib.ps1 windows x64 Release

      - name: Verify native library
        run: |
          if (Test-Path "native\video-processing\lib\windows\x64\video_processing.dll") {
            Write-Host "✅ video_processing.dll found"
          } else {
            Write-Host "❌ video_processing.dll not found"
            exit 1
          }
          
          if (Test-Path "native\video-processing\lib\windows\x64\video_processing.lib") {
            Write-Host "✅ video_processing.lib found"
          } else {
            Write-Host "❌ video_processing.lib not found"
            exit 1
          }

      - name: Generate cinterop bindings
        run: |
          .\gradlew.bat :core:network:cinteropVideoProcessingNativeWindows --no-daemon

      - name: Compile Kotlin Native Windows
        run: |
          .\gradlew.bat :core:network:compileKotlinNativeWindows --no-daemon

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-artifacts
          path: |
            native/video-processing/lib/windows/x64/
            core/network/build/classes/kotlin/nativeWindows/
          retention-days: 7
