apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ip-css.fullname" . }}
  labels:
    {{- include "ip-css.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ip-css.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "ip-css.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ip-css.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.env.SERVER_PORT | default 8080 }}
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: rtsp
              containerPort: 554
              protocol: TCP
          {{- if .Values.env }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.database.postgresql.host }}
            - name: DB_HOST
              value: {{ .Values.database.postgresql.host }}
            - name: DB_PORT
              value: {{ .Values.database.postgresql.port | quote }}
            - name: DB_NAME
              value: {{ .Values.database.postgresql.database }}
            - name: DB_USER
              value: {{ .Values.database.postgresql.username }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.database.postql.existingSecret }}
                  name: {{ .Values.database.postgresql.existingSecret }}
                  {{- else }}
                  name: {{ include "ip-css.fullname" . }}-db
                  {{- end }}
                  key: password
          {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: {{ .Values.persistence.dataSubPath }}
            - name: data
              mountPath: /data/recordings
              subPath: {{ .Values.persistence.recordingsSubPath }}
            - name: data
              mountPath: /data/config
              subPath: {{ .Values.persistence.configSubPath }}
            - name: data
              mountPath: /data/database
              subPath: {{ .Values.persistence.databaseSubPath }}
          {{- if .Values.gpu.enabled }}
            - name: gpu-socket
              mountPath: /var/run/nvidia
          {{- end }}
      {{- if .Values.gpu.enabled }}
      {{- if eq .Values.gpu.type "nvidia" }}
      runtimeClassName: nvidia
      {{- end }}
      {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "ip-css.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.gpu.enabled }}
        - name: gpu-socket
          hostPath:
            path: /var/run/nvidia
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
