apiVersion: v1
kind: Service
metadata:
  name: {{ include "ip-css.fullname" . }}
  labels:
    {{- include "ip-css.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.httpsPort }}
      targetPort: https
      protocol: TCP
      name: https
    - port: {{ .Values.service.rtspPort }}
      targetPort: rtsp
      protocol: TCP
      name: rtsp
  selector:
    {{- include "ip-css.selectorLabels" . | nindent 4 }}
