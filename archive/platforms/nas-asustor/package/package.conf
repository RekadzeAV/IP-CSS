# Asustor APK Package Configuration

[package]
name = "IP-CSS"
version = "0.3.0"
architecture = "x86_64"
firmware = "4.0.0"
maintainer = "NLP-Core-Team"
maintainer_url = "https://github.com/nlp-core-team/ip-css"
description = "IP Camera Surveillance System - Professional video surveillance with AI analytics"
distributor = "https://www.ip-css.com"
distributor_url = "https://www.ip-css.com"
display_name = "IP-CSS"
startable = "yes"
support_centralized_startstop = "yes"
support_service_configuration = "yes"
support_uifiltering = "yes"
support_fw_port_forwarding = "yes"
silent_install = "yes"
silent_upgrade = "yes"
conf_privilege = "root"
dsmuidir = "ui"
dsmappname = "SYNO.SDS.IP-CSS"
install_wizard = "no"
upgrade_wizard = "no"
uninstall_wizard = "no"

[dependencies]
java = "8.0"

[permissions]
data = "rw"
program = "rw"
network = "yes"
notification = "yes"
