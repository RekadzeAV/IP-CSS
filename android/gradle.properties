# Android-specific Gradle settings
# Memory configuration for Android D8/R8 dex compiler
# These settings help prevent OutOfMemoryError during Android builds

# D8/R8 memory settings (AGP 8.0+)
# Override JVM args for Android module to ensure D8 has enough memory
org.gradle.jvmargs=-Xmx12g -XX:MaxMetaspaceSize=2g -XX:+UseG1GC

# R8 code shrinker memory settings
# Увеличено до 10G для KMP проектов с большим количеством intermediate классов
android.enableR8.fullMode=true
android.r8.maxHeapSize=10g

# Disable unnecessary Android build features to reduce memory usage
android.enableBuildCache=true
android.builder.sdkDownload=false

# Parallel execution for Android tasks
android.parallelProjectSync=true

# Disable PNG crunching to reduce memory
android.builder.pngCrushDisabled=true

# D8 heap size (for AGP 8.0+) — увеличено до 12G
android.d8.maxHeapSize=12g

# D8 process JVM args (AGP 8.0+) — увеличено до 12G
android.d8.jvmArgs=-Xmx12g -XX:MaxMetaspaceSize=1g

# Включаем D8 daemon для повторного использования процесса (экономия памяти)
android.d8.disableDaemon=false

# Set D8 max workers to 1 to reduce memory pressure
android.d8.maxWorkers=1

# Disable multidex to reduce D8 memory usage
android.enableMultidex=false

# Additional D8 optimizations
android.d8.mainDexList=false
android.d8.descriptorReferences=true

# Force D8 to use separate process with more memory
android.d8.splitOutput=true
